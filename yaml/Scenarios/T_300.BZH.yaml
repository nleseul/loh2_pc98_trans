      <C_YELLOW>男<C_NONE>
      ちょっと あなたたち 足もとに
      気をつけてくださいよ。

      ここが 有名な発明家 ハリーの家だ。ハリーは おれの友人なんだけど
      城の研究室に こもりっきりなんだ。

      だから おれが ここの管理人になってあげているんだ。
    "original_byte_length": !!int |-

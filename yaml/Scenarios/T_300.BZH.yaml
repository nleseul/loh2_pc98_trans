  !!int "23752": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>ボアード<C_NONE>
      いやー ちょっと とばしすぎたな。
      あぶなく ぶつかるとこだったぜ。

      さあ 王子さま ここが ルドラの港だ。

      <CH0>
      ありがとう。料金は？

      <C_YELLOW>ボアード<C_NONE>
      そんなの いらねえよ。
      どうしてもって言うなら 珍しい酒か
      宝石でもくれよ。

      それより その娘さんと うまくやれよ。おやじさんたちには 黙っててやるよ。

      <CH0>
      えっ 何のこと？

      <C_YELLOW>ボアード<C_NONE>
      とぼけるなよ わかってるって。<WAIT>
      じゃあな また 遊びに来いよ。
      酒でも持ってな ハッハッハ。
    "original_byte_length": !!int |-
      409
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54802
      "target_addr": !!int |-
        23752
    "translated": |-
      <C_YELLOW>Buald<C_NONE>
      Aiee! Someone's in a hurry.
      Almos' had a collision there!

      Welcome ta Rudra Harbor, yer
      Highness.

      <CH0>
      Thank you. What's the fare?

      <C_YELLOW>Buald<C_NONE>
      Don't worry 'bout it! But
      since ya mention it, jus' bring
      me some rare rum or jewels!

      An mos' impor'ntly, take good
      care o' yer young lady. I won't
      breathe a word to 'er father!

      <CH0>
      Huh? What do you mean?

      <C_YELLOW>Buald<C_NONE>
      Ha ha! No need ta hide it! I know
      what's goin' on!<WAIT>
      Come see me again! Bring the rum!

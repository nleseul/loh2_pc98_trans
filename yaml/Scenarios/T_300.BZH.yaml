    "translated": |-
      <C_YELLOW>Man<C_NONE>
      Mind where you step there!

      This house belongs to Harry, the
      famous inventor. He's a friend of
      mine, but he's shut up in his
      laboratory in the castle.

      I'm taking care of the place
      while he's away.
  !!int "24647": !RelocatableTranslatableEntry
    "original": |-

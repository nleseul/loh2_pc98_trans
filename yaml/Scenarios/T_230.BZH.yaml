  !!int "23246": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>男<C_NONE>
      おれたち夫婦は ジェラルドさまの
      別荘の管理をしてるだよ。<IF0068><JUMP5b6e>

      めったに来ねえのに こんなに でかい別荘を 持ってるなんて 金持ちの
      することは わからねえだよ。<LOC5b6e>
    "original_byte_length": !!int |-
      161
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54650
      "target_addr": !!int |-
        23246
    "translated": |-
      <C_YELLOW>Man<C_NONE>
      The two of us take care o'
      Gerald's vacation home.<IF0068><JUMP5b6e>

      It's a huge villa, but he hardly
      ever comes here. There's just no
      makin' sense o' rich folk.<LOC5b6e>
  !!int "23407": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>女<C_NONE>
      <IF0068><JUMP5bd1>ここは ジェラルドさまの別荘よ。
      こーんなに 広いから そうじを
      するのも １日がかりなの。<END>
      <LOC5bd1>別荘の そうじは 女中さんたちが
      やるから しばらくは やらなくて
      いいんですって。
    "original_byte_length": !!int |-
      177
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54659
      "target_addr": !!int |-
        23407
    "translated": |-
      <C_YELLOW>Woman<C_NONE>
      <IF0068><JUMP5bd1>This villa belongs to Master
      Gerald. It's suuuch a big place
      that it takes all day to clean.<END>
      <LOC5bd1>Now that the maids are cleaning
      the villa, I suddenly don't have
      much to do.
  !!int "23584": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>ジェラルド<C_NONE>
      <IF0079><JUMP5ea3><SET0079>きっ きさまらだな !!
      わしの かわいいフローラを
      かどわかしおってからに !!

      わしの かわいいフローラを どこに
      連れていったのだ !!

      <CH0>
      ちょ ちょっと 待ってください。
      ぼくたちには どういうことなのか
      さっぱり わかりませんが。

      <C_YELLOW>ジェラルド<C_NONE>
      きさま とぼけおって !!

      わしの かわいいフローラが
      いなくなってしまったのだ !!
      だれかに 誘拐されてしまったのだ !!

      <CH1>
      よう スケベおやじ。
      慌ててるのは わかるけどよ もう少しよく考えてみろよ。

      もし おれたちが 誘拐してたら
      こんなとこ うろついてるわけが
      ないだろうが。

      <C_YELLOW>ジェラルド<C_NONE>
      ふん 冗談で 言っただけだわい。
      ああ わしの かわいいフローラ。
      いったい どこに 行ってしまったのだ。

      おい お前たち。
      <LOC5ea3>もし わしの かわいいフローラを
      連れてきたら 好きなだけ ほうびを
      くれてやるぞ。
    "original_byte_length": !!int |-
      722
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54674
      "target_addr": !!int |-
        23584
    "translated": |-
      <C_YELLOW>Gerald<C_NONE>
      <IF0079><JUMP5ea3><SET0079>Y-you villains!!
      You're the ones who kidnapped
      my darling Flora!!

      Where have you taken her?!

      <CH0>
      W-wait! We don't know anything
      about what happened!

      <C_YELLOW>Gerald<C_NONE>
      Don't play the fool with me!!

      My darling Flora is gone!!
      Someone has kidnapped her!

      <CH1>
      C'mon, you old perv!
      I know you're in a panic, but try
      to think for a minute.

      If we were the kidnappers, would
      we really be hangin' around here?

      <C_YELLOW>Gerald<C_NONE>
      Hmph. I wasn't being serious.
      Oh, my darling Flora...
      Where could she have gone?

      Listen to me, you.
      <LOC5ea3>If you bring my darling Flora home,you can have anything you want as
      your reward.
  !!int "24306": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>ジェラルド夫人<C_NONE>
      あぁ フローラ ･ ･ ･
      どこに行ってしまったの ･ ･ ･

      きっと ナッシュの館を 出たことが
      ショックだったのね。
      あぁ かわいそうなフローラ ･ ･ ･
    "original_byte_length": !!int |-
      152
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54683
      "target_addr": !!int |-
        24306
    "translated": |-
      <C_YELLOW>Madame Gerald<C_NONE>
      Oh, Flora... where have you gone?

      The shock of leaving our manor in
      Nashieu must have been too much
      for the poor girl...
  !!int "24458": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>チャーリー<C_NONE>
      <IF0078><JUMP604f>むむっ ちょっと お待ちなさい。

      お嬢さまに 男性を 近づけては
      ならないと だんなさまから きつく
      言われています。

      特に あなたたちは 危険だそうです。わかったら 出ていってくださいな。<END>
      <LOC604f>むっ また あなたたちですか。
      だんなさまは 食後の 睡眠中です。

      もし 起きていたとしても 今は
      取り込み中ですから お引き取り
      くださいな。
    "original_byte_length": !!int |-
      331
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54715
      "target_addr": !!int |-
        24458
    - !CodeReference
      "source_addr": !!int |-
        54692
      "target_addr": !!int |-
        24458
    "translated": |-
      <C_YELLOW>Charlie<C_NONE>
      <IF0078><JUMP604f>Ahem. Just a moment.

      The master has told me quite
      sternly that I mustn't allow
      men to approach Miss Flora.

      And you people seem especially
      troublesome. So please be on your
      way.<END>
      <LOC604f>Mm. You people again?
      The master is asleep after his
      meal.

      And even if he were awake, he has
      a great deal on his mind now,
      so I urge you to be on your way.
  !!int "24789": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>男<C_NONE>
      <IF0078><JUMP612f>ここは前の館と比べて 狭いから
      みんな仕事が 楽になったって
      よろこんでいるんだ。<END>
      <LOC612f>お嬢さまが 突然 いなくなったんだ。だんなさまは 誘拐されたとか
      言っているけど 本当かな？
    "original_byte_length": !!int |-
      178
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54724
      "target_addr": !!int |-
        24789
    "translated": |-
      <C_YELLOW>Man<C_NONE>
      <IF0078><JUMP612f>I'm glad that our work has gotten
      easier since this place is so muchsmaller than the manor.<END>
      <LOC612f>Miss Flora disappeared without
      warning. The master says she was
      abducted, but was she really?
  !!int "24967": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>男<C_NONE>
      ここに来たら おらの仕事が
      なくなっちまっただよ。
    "original_byte_length": !!int |-
      54

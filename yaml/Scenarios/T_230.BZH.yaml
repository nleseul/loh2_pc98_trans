  !!int "25021": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>女中<C_NONE>
      <IF0078><JUMP625b>お料理を作るのに 材料が 少なくて
      たいへんなのよ。

      チャーリーが 毎日 アムダまで
      チキンを買いに 行っているんだけど
      チキンばかりじゃ あきちゃうわ。<END>
      <LOC625b>お嬢さまが いなくなる前の日に
      だんなさまと 言い争っているのを
      見ちゃったのよ。

      お嬢さまが いなくなったのは
      きっと そのせいよ。
    "original_byte_length": !!int |-
      285
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54742
      "target_addr": !!int |-
        25021
    "translated": |-
      <C_YELLOW>Maid<C_NONE>
      <IF0078><JUMP625b>We're running out of supplies for
      cooking.

      Charlie goes to Amda every day
      for chicken, but we can't just
      have chicken all the time.<END>
      <LOC625b>The day before Miss Flora vanished,I overheard her arguing with her
      father.

      I'm sure that's why she
      disappeared.
  !!int "25306": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>女中<C_NONE>
      <IF0078><JUMP636a>フローラお嬢さまは ここに来てから
      ふしぎな夢ばかり みてるみたいで
      寝不足らしいわよ。

      でも 夢をみているのに
      寝不足に なるのかしら？<END>
      <LOC636a>フローラお嬢さまは 今ごろ
      どうしているのかしら。

      お嬢さまは 人を うたがうと
      いうことを 知らないから
      変な人に だまされて いなければ
      いいんだけど ･ ･ ･
    "original_byte_length": !!int |-
      294
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54751
      "target_addr": !!int |-
        25306
    "translated": "<C_YELLOW>Maid<C_NONE>\n<IF0078><JUMP636a>I don't think Miss Flora\
      \ is \nsleeping enough. She's been havingstrange dreams since we came here.\n\
      \nI wonder, though. How can she be\ndreaming if she's not sleeping?<END>\n<LOC636a>I\
      \ wonder what Miss Flora is\ndoing now?\n\nShe never thinks to doubt anyone.\n\
      I hope she didn't get talked into\nanything by some shady character..."
  !!int "25600": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>ジェニー<C_NONE>
      <IF0078><JUMP6458>お嬢さまは ここに来てから
      もの思いに ふけることが
      多くなったようです。<END>
      <LOC6458>お嬢さまが いなくなる前に
      女神 フレイアさまが 助けを
      求めていると おっしゃっていました。

      いったい お嬢さまは
      どうなさったのかしら。
    "original_byte_length": !!int |-
      220
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54760
      "target_addr": !!int |-
        25600
    "translated": |-
      <C_YELLOW>Jenny<C_NONE>
      <IF0078><JUMP6458>Miss Flora's mind has seemed to beelsewhere ever since we came here.<END>
      <LOC6458>Before she vanished, Miss Flora
      was talking about the Goddess
      Freya asking for help.

      What could that girl be thinking?

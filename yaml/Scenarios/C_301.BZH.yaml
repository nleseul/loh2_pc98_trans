"_entries":
  !!int "23316": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>アートス国王<C_NONE>
      <IF00b8><JUMP613f><SET00b8><SET00b9>おおっ アトラスではないか !!
      しばらく 見ないうちに また 一段と
      りっぱになって ･ ･ ･

      <Xf52c0000><ASM1ae6><Xf7><CH0>
      お久しぶりです 国王さま。
      父は こちらに 参りましたか？

      <C_YELLOW>アートス国王<C_NONE>
      セリオス殿ならエリオン殿とふたりで参ったが いっしょに モンスターが
      出てくる原因を 調べているそうじゃ。

      わしに 国内の状況を きいてから
      次は モレストンを 調べに行くと
      言っていたが ･ ･ ･<WAIT>
      まさか お前も 調べているのか？

      <CH0>
      いいえ 父に 協力したくて あとを
      追っているのですが なかなか
      追いつけなくて。

      <C_YELLOW>アートス国王<C_NONE>
      アトラスまで わざわざ 危険なまねをしなくても よかろうに ･ ･ ･

      だが かわいい孫には 旅をさせろと
      いうからな。

      それに アトラスのことだ いくら
      わしが 止めても 言うことなど
      ききゃせんだろ。

      気をつけて 行くのじゃぞ。

      <SET00ba><CH2>
      あのー

      <CH1>
      どうした お嬢さんよ。

      <CH2>
      今まで 気になっていたのですけど
      あなた方は いったい ･ ･ ･

      <CH0>
      そういえば 君には 詳しく
      話してなかったかもしれないね。

      ぼくは ファーレーンの王子なんだ。
      でも あまり 王子だということは
      言いたくないんだ。

      その ひと言で みんなの 態度が
      変わってしまったら 本当の姿が
      見られないからね。

      かんたんに言えば お忍びって
      ところかな。

      <CH1>
      ってわけだ。
      でも おれは 全然関係ないぜ。

      おれは ウォンリークのシリカって
      村で 呪文の研究をしてたんだ。

      <CH2>
      まあ そうでしたの。

      知らなかったとはいえ いろいろと
      失礼なことをしてしまいまして ･ ･ ･

      <CH1>
      関係ねえよ。
      おれなんか アトラスのことを
      呼び捨てだぜ なあ アトラス？

      <CH0>
      そう あまり 王子だってことには
      こだわらなくていいんだよ。

      <CH2>
      ええ わかりました。
      それで 私は これから どうすれば
      いいのでしょうか？

      <CH0>
      父上たちは モレストン共和国に
      向かったそうだから いっしょに
      行かないか？

      <CH2>
      はい お願いします。<END>
      <LOC613f>アトラス、あまり 危険なことをして
      ディーナに 心配をさせぬようにな。
    "original_byte_length": !!int |-
      1647
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54663
      "target_addr": !!int |-
        23316
    "translated": |-
      <C_YELLOW>King Arthos<C_NONE>
      <IF00b8><JUMP613f><SET00b8><SET00b9>Oh! Is that you, Atlas?!
      You have grown even more since
      I saw you last.

      <Xf52c0000><ASM1ae6><Xf7><CH0>
      It's an honor to see your Majesty
      again. Has Father been here?

      <C_YELLOW>King Arthos<C_NONE>
      Yes, Selios and Aerion both. They
      are investigating the source of
      the monsters together.

      Once they had inquired after the
      situation in Soldythe, they said
      they would proceed to Moreston.<WAIT>
      Might you be assisting them?

      <CH0>
      No... I wanted to help, so I've
      been following them. But I haven'tbeen able to catch up yet.

      <C_YELLOW>King Arthos<C_NONE>
      I see... Though I am sure there
      was no need to put yourself in
      danger as well.

      Still, if this journey is what my
      dear grandson wishes...

      And in any case, knowing my
      grandson, it would be futile to
      try to stop you.

      Take care in your travels.

      <SET00ba><CH2>
      Um...

      <CH1>
      What's up, Flora?

      <CH2>
      I have been wondering for some
      time... who exactly you people
      are.

      <CH0>
      Oh, I guess we didn't really
      explain much to you.

      I'm the prince of Farleyn.
      I'd generally rather you don't
      call me that, though.

      Just that one word changes things
      so that no one lets you see what
      they're really thinking.

      So I guess I'm in disguise, to
      put it bluntly.

      <CH1>
      Right, what he said.
      But I'm nothin' to do with all
      that.

      I did magical research in a
      village called Silica in Wonliech.

      <CH2>
      Oh... I see.

      I must have been very rude in
      my ignorance...

      <CH1>
      It's no problem. I've been plenty
      disrespectful of the royal person
      myself... right, Atlas?

      <CH0>
      Yeah. So I hope you won't let
      the "prince" thing bother you
      too much.

      <CH2>
      I understand.
      So what do you suggest I do next?

      <CH0>
      It sounds like Father is on his
      way to Moreston, so why not head
      there with us?

      <CH2>
      Of course. Thank you for your
      assistance.<END>
      <LOC613f>Please do not add to Dina's
      worries by putting yourself in
      undue danger, Atlas.

      <C_YELLOW>Soldier<C_NONE>
      It's been 20 years since we've hadmonsters. And there was that othertrouble then too, of course.

      That was when Princess Dina was
      abducted and vanished.

      They had us rookies searching all
      over the desert, but it was
      ultimately Prince Selios who foundher.

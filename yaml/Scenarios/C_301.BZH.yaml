  !!int "25145": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>兵士<C_NONE>
      モンスターなんて ２０年ぶりですね。そういえば あのときは たいへん
      でしたよ。

      ディーナさまが 誘拐されて
      行方不明に なってしまったんですよ。

      私たち 新入りは あの広い砂漠の中をずっと 探しまわっていたんですけど
      結局 セリオスさまたちが 見つけて
      くださったのです。

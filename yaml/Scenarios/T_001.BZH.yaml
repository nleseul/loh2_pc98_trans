      "source_addr": !!int |-
        54776
      "target_addr": !!int |-
        24679
    "translated": |-
      <C_YELLOW>Tool merchant<C_NONE>
      <IF0068><JUMP60bb>Hello, your Highness.
      Have you come all the way here to
      go slime-chasing?<END>
      <LOC60bb>Why would monsters have appeared?

      And how are we supposed to live
      while worrying about monsters?

"_entries":
  !!int "23301": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>武器屋<C_NONE>
      これは、アトラス王子さま。
      <IF0068><JUMP5bbd>世界が 平和になって しまったので
      武器が ちっとも 売れないんです。

      これじゃ 商売にならないから
      今度 パン屋でも 始めようかと
      思っているんです。<END>
      <LOC5bbd>モンスターのせいで あっというまに
      武器が 売り切れてしまいました。

      こんなに 売れたのは 初めてなので
      うれしいような 気がするのですが
      どうも すなおに よろこべないんです。
    "original_byte_length": !!int |-
      352
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54782
      "target_addr": !!int |-
        23301
    "translated": "<C_YELLOW>Weapon merchant<C_NONE>\nWelcome, Prince Atlas.\n<IF0068><JUMP5bbd>With\
      \ the world is at peace, there\nisn't any demand for weapons.\n\nI can't do\
      \ any business like this.I wonder if I should open a bakerynext.<END>\n<LOC5bbd>Thanks\
      \ to those monsters, my\nweapons sold out in no time.\n\nBusiness has never\
      \ been better. I\nsuppose I should be happy, but \nto be honest, I can't really\n\
      celebrate."
  !!int "23653": !RelocatableTranslatableEntry
    "original": |-
      <CALL6129>王子さまが お城にいかれてから
      食事の したくを していても 何か
      物足りないんです。
    "original_byte_length": !!int |-
      84
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54698
      "target_addr": !!int |-
        23653
    "translated": |-
      <CALL6129>I've still been cooking since yourHighness left for the castle, but
      it doesn't feel the same.
  !!int "23737": !RelocatableTranslatableEntry
    "original": |-
      <CALL6129>まあ、王子さま。
      どう なさったのですか？
      <IF0068><JUMP5d05>こんな所まで 来るなんて。<END>
      <LOC5d05>

      外には モンスターがいるというのに
      わざわざ こんな所まで 来るなんて。
    "original_byte_length": !!int |-
      146
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54707
      "target_addr": !!int |-
        23737
    "translated": |-
      <CALL6129>Why, your Highness! What brings
      you <IF0068><JUMP5d05>all the way out here?<END>
      <LOC5d05>out here?

      I can't believe you came all this
      way, with the monsters outside.
  !!int "23883": !RelocatableTranslatableEntry
    "original": |-
      <CALL6130>町の者たちには 王子さまは しばらくお城の方で お勉強を していることになっておりますので ご安心ください。
    "original_byte_length": !!int |-
      107
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54716
      "target_addr": !!int |-
        23883
    "translated": "<CALL6130>Don't worry; the people here know\nthat your Highness\
      \ is studying\nat the castle for a while. "
  !!int "23990": !RelocatableTranslatableEntry
    "original": |-
      <CALL6130><IF0068><JUMP5dfe>王子さま、危険なことなどせずに
      よい旅を なさってきてください。<END>
      <LOC5dfe>王子さま エルアスタは どんなことがあっても 守ってみせます。
      安心してください。
    "original_byte_length": !!int |-
      151
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54725
      "target_addr": !!int |-
        23990
    "translated": "<CALL6130><IF0068><JUMP5dfe>Have a good journey, your Highness.And\
      \ stay safe.<END>\n<LOC5dfe>Rest easy, your Highness.\nWe'll keep Eluasta safe\
      \ no matter\nwhat happens. "
  !!int "24141": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>男<C_NONE>
      あ、王子さま いらっしゃい。
      <IF0068><JUMP5ea6>しばらく ルディアの お城で
      勉強をするそうですね？<END>
      <LOC5ea6>モンスターが 出てきたら スライムがいなくなったみたいですね。
    "original_byte_length": !!int |-
      150
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54761
      "target_addr": !!int |-
        24141
    "translated": |-
      <C_YELLOW>Man<C_NONE>
      Oh, hello, your Highness.
      <IF0068><JUMP5ea6>I hear you will be studying in
      Rudia for a while?<END>
      <LOC5ea6>It looks like all the slimes are
      gone since the monsters appeared.
  !!int "24291": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>男<C_NONE>
      おや 王子さま。
      <IF0068><JUMP5f1e>お城から 遊びにみえたのですか？<END>
      <LOC5f1e>ぶっそうに なったものですね
      どうして モンスターなんかが ･ ･ ･
    "original_byte_length": !!int |-
      121
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54770
      "target_addr": !!int |-
        24291
    "translated": |-
      <C_YELLOW>Man<C_NONE>
      Oh, your Highness.
      <IF0068><JUMP5f1e>Have you come from the castle
      to see us?<END>
      <LOC5f1e>Things are getting dangerous, eh?
      Why would monsters...?
  !!int "24412": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>女<C_NONE>
      ま、王子さま。
      お久しぶりで ございます。
    "original_byte_length": !!int |-
      46
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54734
      "target_addr": !!int |-
        24412
    "translated": |-
      <C_YELLOW>Woman<C_NONE>
      It's good to see you again,
      your Highness.
  !!int "24458": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>子供<C_NONE>
      <IF0068><JUMP5fd8>王子さま、
      いつになったら スライムいじめに
      連れてってくれるの？ <END>
      <LOC5fd8>外には 怖いモンスターがいるから
      町から 出ちゃいけないんだって。
      あーあ つまんないな。
    "original_byte_length": !!int |-
      164
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54743
      "target_addr": !!int |-
        24458
    "translated": |-
      <C_YELLOW>Child<C_NONE>
      <IF0068><JUMP5fd8>When're we going slime-chasing
      again, your Highness?<END>
      <LOC5fd8>I'm so bored! I can't leave town
      because of the scary monsters
      outside.
  !!int "24622": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>パーカー<C_NONE>
      王子さま、おら もう 抜け穴は
      作らねーですだ。
    "original_byte_length": !!int |-
      57
    "references":

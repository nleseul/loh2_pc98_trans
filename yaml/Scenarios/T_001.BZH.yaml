        54752
      "target_addr": !!int |-
        24622
    "translated": |-
      <C_YELLOW>Parker<C_NONE>
      I'll not go a-makin' holes fer
      yer Highness again.
  !!int "24679": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>道具屋<C_NONE>
      <IF0068><JUMP60bb>これは 王子さま。
      こちらの方まで スライムいじめに
      いらしたのですか？<END>
      <LOC60bb>どうして モンスターなんかが
      出てきたのでしょう？

      また やつらに おびえながら
      くらさなければ ならないとは ･ ･ ･
    "original_byte_length": !!int |-
      194
    "references":

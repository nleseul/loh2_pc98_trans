    "translated": |-
      <C_YELLOW>Child<C_NONE>
      Monsters're scary, right? When're
      they going to go away? It's boringnot being able to leave town.
  !!int "23606": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>男<C_NONE>
      おれは 貿易商だから 仕事で
      ウォンリークに 行ったりするんだよ。

      向こうでも やっぱり モンスターが
      出てきていて 大騒ぎをしていたよ。
      いったい どうなるんだろうな。
    "original_byte_length": !!int |-
      165
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54852
      "target_addr": !!int |-
        23606
    "translated": |-
      <C_YELLOW>Man<C_NONE>
      I'm a trader, so I'm often in
      Wonliech to do business.

      The monsters are causing an uproarover there too, naturally. What
      the heck is going on?
  !!int "23771": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>男<C_NONE>
      この前 モンスターを 見てみようと
      思って わざわざ クルスの方まで
      行ってみたんだ。

      災害のお守りを ７つも持ってたから
      すっかり 安心していたんだよ。

      そうしたら なぜか 知らないけど
      モンスターが おそってきたんだ。
      それで 夢中で 逃げていたら 石に
      つまづいて けがをしたんだよ。

      せっかく ７つも買ったのに 全然
      役に立たないんだぜ。
      あの商人に だまされちゃったよ。
    "original_byte_length": !!int |-
      359
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54861
      "target_addr": !!int |-
        23771
    "translated": |-
      <C_YELLOW>Man<C_NONE>
      A while ago, I went all the way
      to Crus, thinking I'd have a look
      at those monsters.

      With my 7 Disaster Charms, I felt
      totally safe.

      I just don't understand how those
      monsters could attack me. And then,when I was frantically fleeing,
      I hurt myself tripping on a rock.

      All those Disaster Charms I bought,and they were completely useless!
      I got scammed by that merchant!
  !!int "24130": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>女<C_NONE>
      災害のお守りって インチキだった
      らしいわよ。
      買わなくて よかったわ。
    "original_byte_length": !!int |-
      74
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54870
      "target_addr": !!int |-
        24130
    "translated": |-
      <C_YELLOW>Woman<C_NONE>
      People are saying that Disaster
      Charms were a scam. I'm glad I
      didn't buy one.
  !!int "24204": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>老人<C_NONE>
      フン やっぱり 災害のお守りなんて
      インチキだったようじゃ。
      わしの 言ったとおりじゃわい。
    "original_byte_length": !!int |-
      95

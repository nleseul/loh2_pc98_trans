      <CH1>
      おい お嬢さん 自分で 言ってること
      わかってるのか？

      <CH2>
      ええ わかっています。
      自分でも おかしいとは 思うのですがでも 呼んでいるんです。

      <CH0>
      どうして わかるんだい？

      <CH2>
      ナッシュが モンスターにおそわれて
      私たち一家は セレにある別荘に
      逃げました。

      そして その夜に フレイアさまが
      現れて 私の方を じっと見つめて
      いたのです。

      私が 話しかけても 黙ったままで
      答えてくれません。<WAIT>
      でも とても 悲しそうな顔をして
      なにか 言いたそうでした。

      <CH1>
      なあ お嬢さん。
      そりゃあ 夢ってやつだぜ。

      <CH2>
      私も 起きたときは そう思いました。でも それから 毎晩 フレイアさまが
      現れるように なったんです。

      そして 気がついたのです。
      フレイアさまは 私に 助けを求めて
      いるということが。

      <CH1>
      ふーん ･ ･ ･ でもな お嬢さん。
      女神である フレイアさまがだ
      なんで 助けを 求めてくるんだ？

      だいたい フレイアさまが どこに
      いるか知ってるのかよ？

      <CH2>
      さあ ･ ･ ･ わかりません。

      自分でも 知らないうちに この洞窟に入ってしまったのです。

      でも ここでは なさそうです。
      どこか もっと遠くのような それとも近くのような ･ ･ ･

      <CH1>
      何だよ ･ ･ ･ はっきり どの辺だってわからねえのか？

      <CH2>
      さあ それが はっきり わかれば
      いいのですが ･ ･ ･

      <CH1>
      そんなことじゃ さがしようがねえぜ。

      <CH2>
      ええ ･ ･ ･<WAIT>
      でも きっと また フレイアさまが
      現れて 教えてくれると 思います。

      <CH1>
      お前さん こんな目に あっときながらまだ うろちょろ しようってのか？

      ここだけじゃなく 竜の卵からなんか
      モンスターが うじゃうじゃ 出てきてやがるんだぜ。

      ひどいめに あわねえうちに 家に
      帰ったほうがいいぜ お嬢さんよ。

      <CH2>
      ご忠告 ありがとうございます。<WAIT>
      でも 私はどうしても フレイアさまのもとに 行かなければ ならないのです。

      <CH1>
      やれやれ 困った お嬢さんだこと。

      <CH0>
      まあ いいじゃないか ランドー。

      セリスの城に 入れたのも 彼女の
      おかげなんだし。
      いっしょに ソルディス王国に行こう。

      バズヌーンの城に ぼくの父が
      行っているはずなんだ。

      父に 君がみた夢の話をして 何か
      手がかりになることがないか
      きいてみよう。

      <CH2>
      本当ですか !!
      ありがとうございます。

      <SET0090><ASMd838><Xf7><C_GREEN>フローラが 仲間になりました。<SND0103><C_NONE>

      あのー 言いづらいことですが ･ ･ ･

      どうやら 私のお父さまが 国境にいる兵士たちに 手をまわして 私が
      ラヌーラから 出られないように
      してあるみたいなのです ･ ･ ･

      <CH1>
      ほらみろ アトラス。
      やっかいなことに なったぜ。
      だから やめとけば よかったんだ。

      <CH0>
      まあ いいじゃないか 何か方法が
      あるはずだよ。

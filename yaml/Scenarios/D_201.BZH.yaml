      <CH0>
      何か わけがあるんだね？
      よかったら 話してくれないか？

      <CH2>
      えっ でも ･ ･ ･
      バカにされるだけですから ･ ･ ･

      <CH0>
      そんなことないよ きみのような子が
      家出をするんだから それなりの
      わけが あるんだろ？

      <CH2>
      フレイアさまを 探しに来たんです。

      <CH1>
      へっ !? なんだって？

      <CH2>
      女神 フレイアさまが 私を 呼んで

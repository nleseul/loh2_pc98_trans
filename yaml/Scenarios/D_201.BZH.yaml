      ここに来たんだ。

      <CH2>
      えっ !?
      どうして 私がここにいると？

      <CH0>
      兵士が たまたま 君のワプの翼を
      見つけたんだ。

      どうして ひとりで こんなに危険な
      所に 入ってきたんだい？

      <CH2>
      実は ･ ･ ･<WAIT>
      いえ やっぱり言えません。

      <CH1>
      ははーん わかったぞ お嬢さん。
      あんた 何か悪いことしたんだろ？

      <CH2>
      違います。

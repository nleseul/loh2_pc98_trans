  !!int "23363": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>男<C_NONE>
      王子さま、竜の卵は 不吉な物
      なんでしょうか？
      せっかく よろこんで いたのに ･ ･ ･
    "original_byte_length": !!int |-
      85
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54633
      "target_addr": !!int |-
        23363
    "translated": |-
      <C_YELLOW>Man<C_NONE>
      Are dragonseggs really a bad omen,your Highness?
      And here I was celebrating...
  !!int "23448": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>男<C_NONE>
      こんなことに なるんだったら
      竜の卵なんか 出てこなければ
      よかったんですよ。
    "original_byte_length": !!int |-
      80
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54642
      "target_addr": !!int |-
        23448
    "translated": |-
      <C_YELLOW>Man<C_NONE>
      After this, I wish the
      dragonsegg had never appeared.
  !!int "23528": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>男<C_NONE>
      あっ 王子さま、モンスターが
      クルスの村を おそって つぶして
      しまったんですよ。
    "original_byte_length": !!int |-
      83
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54651
      "target_addr": !!int |-
        23528
    "translated": |-
      <C_YELLOW>Man<C_NONE>
      Your Highness! The monsters
      attacked and destroyed Crus.
  !!int "23611": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>男<C_NONE>
      王子さま、武器屋のスコットは
      地震が 起こってから ずっと寝たままなんですよ。

      もし モンスターが おそってきたら
      どうする つもりなんでしょうね。
    "original_byte_length": !!int |-
      146
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54660
      "target_addr": !!int |-
        23611
    "translated": |-
      <C_YELLOW>Man<C_NONE>
      The weapon merchant, Scott, hasn'tbeen out of bed since the
      earthquake, your Highness.

      I don't know what he expects
      to do if the monsters attack.
  !!int "23757": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>男<C_NONE>
      いくら モンスターが 出てきても
      セリオスさまがいれば きっと
      やっつけて くれるでしょう。
    "original_byte_length": !!int |-
      92
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54669
      "target_addr": !!int |-
        23757
    "translated": |-
      <C_YELLOW>Man<C_NONE>
      No matter how many monsters appear,I know King Selios will take care
      of them.
  !!int "23849": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>女<C_NONE>
      クルスが つぶされたそうですよ。
      ここにも 何人か 逃げてきてますけどよく けがを しなかったものですわ。
    "original_byte_length": !!int |-
      106
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54678
      "target_addr": !!int |-
        23849
    "translated": |-
      <C_YELLOW>Woman<C_NONE>
      Apparently Crus has been destroyed.Some people fled here. Luckily,
      they're uninjured.
  !!int "23955": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>女<C_NONE>
      竜の卵が 出てきたのは いいことの
      前ぶれだと 思っていたのに どうしてこんなことに なったのかしら ･ ･ ･
    "original_byte_length": !!int |-
      106
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54687
      "target_addr": !!int |-
        23955
    "translated": |-
      <C_YELLOW>Woman<C_NONE>
      I thought the dragonsegg was
      a sign of good things to come!
      How could this have happened...?
  !!int "24061": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>老人<C_NONE>
      アロン殿は クルスの村が つぶされてしまったので すっかり 気落ちして
      おるのです。
    "original_byte_length": !!int |-
      87
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54696
      "target_addr": !!int |-
        24061
    "translated": |-
      <C_YELLOW>Old man<C_NONE>
      Alon has been inconsolable ever
      since Crus Village was destroyed.
  !!int "24148": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>兵士<C_NONE>
      モンスターが 現れたというのに
      なぜか 国民から 危機感というものが感じられないのです。

      セリオスさまが 何とかしてくれると
      思っているからでしょうね？
    "original_byte_length": !!int |-
      153
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54705
      "target_addr": !!int |-
        24148
    "translated": |-
      <C_YELLOW>Soldier<C_NONE>
      Even with monsters appearing, the
      townspeople don't seem to feel anysense of danger.

      I suppose they're expecting King
      Selios to take care of it somehow.
  !!int "24301": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>兵士<C_NONE>
      王子さま ご安心ください。
      もしモンスターが 来たら われわれがやっつけてやりますよ。
    "original_byte_length": !!int |-
      90
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54714
      "target_addr": !!int |-
        24301
    "translated": |-
      <C_YELLOW>Soldier<C_NONE>
      Don't worry, your Highness.
      If the monsters come here, we'll
      take care of them.
  !!int "24391": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>スコット<C_NONE>
      あっ これは 王子さま。
      地震のときに 家にあった武器が
      私めがけて 落ちてきたのです。

      今でも 武器を見ると 体のふるえが
      止まらなくなるんです。
    "original_byte_length": !!int |-
      150
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54729
      "target_addr": !!int |-
        24391
    "translated": |-
      <C_YELLOW>Scott<C_NONE>
      Hello, your Highness. During the
      earthquake, all the weapons in my
      house fell straight at me.

      I still can't stop shaking every
      time I see a weapon.
  !!int "24541": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>アロン<C_NONE>
      おお これは アトラスさま。
      私の思い出の場所である クルスが
      つぶされてしまいました。

      せっかく あそこで のんびりと
      くらしていたのに ･ ･ ･
    "original_byte_length": !!int |-
      145
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54738
      "target_addr": !!int |-
        24541
    "translated": |-
      <C_YELLOW>Alon<C_NONE>
      Oh, your Highness.
      Everything I knew was in Crus,
      but it's all gone now.

      I was sure I would live out my
      days there...
  !!int "24686": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>クルスにいた女<C_NONE>
      モンスターが 攻めてきたとき 村には私と アロンさんしか いなかったの。

      他の人たちは 鉱山を手伝いに
      行っていたから あの恐ろしい体験を
      したのは ２人だけね。
    "original_byte_length": !!int |-
      170
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54747
      "target_addr": !!int |-
        24686
    "translated": |-
      <C_YELLOW>Woman from Crus<C_NONE>
      There was no one in Crus except
      me and Alon when the monsters
      attacked.

      Everyone else was helping at the
      mine. So it was only us who had
      that terrifying experience.
  !!int "24856": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>バーテン<C_NONE>
      これは王子さま、いらっしゃいませ。お酒は 出せませんが ゆっくり

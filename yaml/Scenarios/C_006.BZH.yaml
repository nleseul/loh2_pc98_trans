    "translated": |-
      <C_YELLOW>Dina<C_NONE>
      <IF000d><JUMP63cb><IF000f><JUMP6346><SET000f>Atlas...
      Thank goodness you're all right.

      I feared the worst when monsters
      started appearing from the
      dragonseggs.

      <IF000e><JUMP5ce7>And who might this be?

      <CH0>
      Oh, I'm sorry, Mother.
      I haven't been traveling entirely
      on my own...

      <CH1>
      Your Majesty. It's an honor.
      My name is Landor.

      I kinda just decided to follow hisHighness on my own. Please don't
      be angry at him.

      <C_YELLOW>Dina<C_NONE>
      No, I'm far from angry.

      Atlas's journey had many goals,
      but finding friends he can rely
      on was one of them.

      Thank you for taking care of him,
      Landor.

      <LOC5ce7><CH0>
      What about Farleyn, Mother?
      What's happening here?

      <C_YELLOW>Dina<C_NONE>
      ...Crus was attacked.

      <CH0>
      Oh... And Selis, too.
      That's why I hurried home from
      Lanoura.

      What's Father doing?

      <C_YELLOW>Dina<C_NONE>
      His Majesty is heading to Wonliechaboard the dragon.

      He thinks the situation could be
      affecting the whole world, so he'sgoing to investigate and prepare
      countermeasures.

      <CH0>
      Of course... the dragon...

      Mother, I'm going too.

      <C_YELLOW>Dina<C_NONE>
      Atlas?!
      What are you saying?

      <CH0>
      I want to go with Father and find
      out what's happening to the world.

      <C_YELLOW>Dina<C_NONE>
      You can't put yourself in danger
      like that. Not when you've only
      just come home safe.

      <CH0>
      I know, I know.
      But King Aerion...

      When monsters appeared in Lanoura,his first thought was the safety
      of his people.

      And Father's like that too.
      Right now, I know he's thinking
      not only of his own subjects, but
      of everyone in the world.

      <C_YELLOW>Rauel, royal tutor<C_NONE>
      Prince Atlas!! What magnificent
      words! Such music to an old man's
      ears!

      Please, your Majesty. This is
      my wish as well. Allow the Prince
      to do as he wishes.

      <C_YELLOW>Dina<C_NONE>
      ...You too, Rauel?

      Very well.
      Although it seems a dangerous
      lesson...

      <CH0>
      Mother... thank you.

      <C_YELLOW>Landor<C_NONE>
      Don't worry, your Majesty.
      I'll be goin' with him.

      <C_YELLOW>Dina<C_NONE>
      It would relieve me to know that
      he'll be traveling with such a
      strong man as yourself.

      I apologize for burdening you,
      but please look after Atlas.

      <CH0>
      You don't need to worry!
      I'll join up with Father soon.

      <C_YELLOW>Landor<C_NONE>
      Hey, by "dragon," did she mean...?

      <CH0>
      Yeah, the ones that live in
      Soldythe.

      <C_YELLOW>Landor<C_NONE>
      You mean you can ride 'em?

      <CH0>
      I guess so.
      I've always wanted to ride it,
      but no one ever let me.

      <C_YELLOW>Landor<C_NONE>
      That's incredible!!
      Let's hurry! Wonliech, right?<END>
      <LOC6346>There should be some equipment
      left in the basement, Atlas.
      Please take it with you.

      And you can store anything you're
      carrying in the armory.<END>
      <LOC63cb>Please join his Majesty as soon
      as you can. And be careful not to
      get in his way.

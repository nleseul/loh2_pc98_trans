        54687
      "target_addr": !!int |-
        24229
    "translated": |-
      <C_YELLOW>Woman<C_NONE>
      King Arthos built a laboratory
      inside the castle to help Harry
      develop his inventions.
  !!int "24321": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>女<C_NONE>
      この国の お姫さま ディーナ姫は
      ファーレーンの セリオス国王さまの
      所へ 嫁いでいったのよ。

      私が まだ 若かったころなんだけど
      それはもう お似合いのカップルで
      かなり 話題になっていたわよ。
    "original_byte_length": !!int |-
      189
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54696
      "target_addr": !!int |-
        24321
    "translated": |-
      <C_YELLOW>Woman<C_NONE>
      Dina, the princess of Soldythe,
      married into the Farleyn royal
      family and lives with King Selios.

      I was still young back then, but
      everyone talks about what a
      perfect couple they were.

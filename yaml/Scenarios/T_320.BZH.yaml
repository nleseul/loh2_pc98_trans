        23851
    "translated": |-
      <C_YELLOW>Man<C_NONE>
      I'm a tool merchant, but since I
      let my wife run the shop, all I
      need to do is acquire products.
  !!int "23948": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>男<C_NONE>
      この近くに カザミの塔という 古い
      塔があったんだけど ずっと前の
      大地震で 沈んじまったんだよ。

      発明家のハリーが それを見て すごくがっかりしてたから 話をきいたら
      あの塔には 思い出が あったんだ
      とかって言ってたなあ。

      そういえば 昔は よくあの塔から
      大凧で 空を飛んでいたからなあ。
    "original_byte_length": !!int |-
      281
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54678
      "target_addr": !!int |-
        23948
    "translated": |-
      <C_YELLOW>Man<C_NONE>
      An ancient tower near here called
      the Vane Tower collapsed after
      the earthquake a while ago.

      Harry, the inventor, was really
      disappointed when he saw that.
      Said he had memories of that toweror some such.

      Now that I think about it, didn't
      we often see big kites flying
      around there back in the day?
  !!int "24229": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>女<C_NONE>
      アートス国王さまは ハリーさんの
      発明に 協力するために お城の中に
      研究室を 作ったのよ。
    "original_byte_length": !!int |-
      92
    "references":

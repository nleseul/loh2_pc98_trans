  !!int "23302": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>兵士<C_NONE>
      私たちは 町の中に モンスターが
      入り込まないように 見張って
      いるのです。
    "original_byte_length": !!int |-
      79

      "target_addr": !!int |-
        23302
    "translated": |-
      <C_YELLOW>Soldier<C_NONE>
      We're keeping watch so no monsterscan get into the town.
  !!int "23381": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>兵士<C_NONE>
      この国の 砂漠の真中あたりに エメ
      というオアシスが あったのです。

      ところが 数日前に モンスターに
      おそわれて 人々は 逃げ出して
      今では モンスターしか いなくなってしまいました。
    "original_byte_length": !!int |-
      181
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54642
      "target_addr": !!int |-
        23381
    "translated": |-
      <C_YELLOW>Soldier<C_NONE>
      There was an oasis called E'me
      near the middle of the desert.

      But a few days ago, it got
      attacked by monsters and everyone
      there fled. Now there's nothing
      there but monsters.
  !!int "23562": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>兵士<C_NONE>
      いやー あんたたち 知ってたか？
      ドラゴンに 乗ることが できるんだぞ。

      カウルの村にいる ドラゴンの
      子どもだと 思うんだがな。
      セリオスさまが 乗ってきたんだよ。
      もう びっくりしちゃったよ。
    "original_byte_length": !!int |-
      191
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54651
      "target_addr": !!int |-
        23562
    "translated": |-
      <C_YELLOW>Soldier<C_NONE>
      Wow... I don't believe it!
      Did you know you can ride dragons?

      I think it was that young dragon
      from Caur... but King Selios was
      riding it! I'm still in shock!
  !!int "23753": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>兵士<C_NONE>
      いやー 本当に びっくりしたぜ。
      あの ばかでかいドラゴンが 急に
      空から降りてくるんだもんな。
    "original_byte_length": !!int |-
      98
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54660
      "target_addr": !!int |-
        23753
    "translated": |-
      <C_YELLOW>Soldier<C_NONE>
      No way! I couldn't believe my eyeswhen that ginormous dragon swoopeddown from the sky!
  !!int "23851": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>男<C_NONE>
      おれは 道具屋なんだが 店のほうは
      女房にまかせてあるから 品物を
      仕入れに行くだけでいいんだ。

  !!int "23454": !RelocatableTranslatableEntry
    "original": |-
      <IF0059><JUMP5e6f><SET0059><Xf52c0000><ASM1ae6><Xf7><CALL6cf5>あら アトラス王子。
      もう少し 早ければ セリオスさまが
      いらっしゃったのに。

      ついさっきまで エリオンさまと
      モンスターについて お話をしていて
      それから 二人でモンスターの 調査に出かけてしまったのです。

      今ごろは きっと ソルディス王国に
      向かわれていると思います。

      <CH0>
      そうですか エリオンさままで
      ごいっしょに ･ ･ ･

      <CALL6cf5>セリオスさまに 何か ご用でも？

      <CH0>
      ええ 父上の 手助けをしようと思ってあとを 追ってきたのです。

      <CALL6cf5>まあ 何もアトラス王子まで 危険を
      おかす必要など ないのに。

      でも ごりっぱなことですわ。
      セリオスさまが きいたら きっと
      およろこびに なるでしょう。

      今から ソルディスに 向かえば
      きっと 追いつけるはずです。

      <CH0>
      ソルディスですか ･ ･ ･<WAIT>
      わかりました 早速 行ってみます。
      どうも ありがとうございました。<END>
      <LOC5e6f><CALL6cf5><IF0090><JUMP5ee5>王子さま 王家の墓には 防犯用に
      落し穴を作ってあります。

      くれぐれも ケガをされないように
      お気をつけください。<END>
      <LOC5ee5><IF0087><JUMP6133><SET0087>まあ フローラお嬢さま。
      無事で なによりでしたわ。

      <CH2>
      私のために いろいろと ご迷惑を
      おかけしたそうで ･ ･ ･

      <CALL6cf5>いいえ そんなことはありません。
      それにしても 本当によかったわ。

      お嬢さまを お送りするのは わが国の兵士に おまかせください。

      <CH2>
      あっ いいんです 王妃さま。

      <CH0>
      えっ!? ああ そう いいんです。

      <CH1>
      おれたちが 送っていってやることに
      なってるから 気にしないでください。

      <CALL6cf5>まあ そうですか？
      それでは おまかせします。

      ところで ちょっと 気になったことがあるのですが セリオスさまたちにも
      伝えておいた方が いいと思いまして。

      <CH0>
      どんなことですか？

      <CALL6cf5>ええ 司祭 バーバラのことなのです。

      <LOC6133>竜の卵に 入ることが できるのは
      司祭 バーバラだけなのですが。
      今は 行方不明に なっています。

      バーバラは この事件について 何かを知っていて それを 解決しようと
      しているのでは ないでしょうか？

      もし バーバラの 行方が わかれば
      何らかの 手がかりが つかめるかと
      思うのです。

      セリオスさまたちに 追いついたら
      このことを 伝えてください。
    "original_byte_length": !!int |-
      1756
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54682
      "target_addr": !!int |-
        23454
    "translated": |-
      <IF0059><JUMP5e6f><SET0059><Xf52c0000><ASM1ae6><Xf7><CALL6cf5>Prince Atlas! You just missed
      Selios.

      He was just here talking to Aerionabout the monsters, and then the
      two of them went off together to
      investigate.

      I'm sure they're halfway to
      the Kingdom of Soldythe by now.

      <CH0>
      Really? King Aerion too...?

      <CALL6cf5>Were you looking for Selios?

      <CH0>
      Yes. I was following him because Iwant to help him.

      <CALL6cf5>Oh, I see. But there's no need foryou to put yourself in danger too.

      But it's very noble of you. I
      know Selios would be happy to hearyou say that.

      You should be able to catch up
      if you head for Soldythe now.

      <CH0>
      Soldythe...?<WAIT>
      Okay. We'll go right away. Thank
      you for everything, your Majesty.<END>
      <LOC5e6f><CALL6cf5><IF0090><JUMP5ee5>There are pit traps to catch
      thieves in the Royal Tomb.

      Stay careful, and try not to
      get yourself hurt.<END>
      <LOC5ee5><IF0087><JUMP6133><SET0087>Oh, Flora! I'm glad to see you're
      all right.

      <CH2>
      I seem to have caused your Majestya great deal of trouble...

      <CALL6cf5>Don't worry about it. What mattersis that you're safe.

      I'll have the soldiers escort you
      home.

      <CH2>
      Oh! Please don't trouble yourself
      with that, your Majesty.

      <CH0>
      Huh?! Oh, no, that won't be
      necessary.

      <CH1>
      Yeah, we'll bring her home for
      you, so don't worry about it.

      <CALL6cf5>Oh, really? In that case, I'll
      leave the matter to you.

      Oh, incidentally, I do have a
      concern that I think you should
      convey to Selios.

      <CH0>
      What is it?

      <CALL6cf5>It's about Barbara, the high
      priestess.

      <LOC6133>Barbara is the only person who canenter a dragonsegg, but no one
      knows where she is currently.

      So I wonder if she knows somethingabout our situation and is trying
      to resolve it.

      I think if we can find Barbara,
      we might learn something that
      will help.

      If you catch up to Selios and
      Aerion, please convey that
      suggestion to them.
  !!int "25210": !RelocatableTranslatableEntry

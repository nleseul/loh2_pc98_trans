      <C_YELLOW>ポウエル<C_NONE>
      セリスとナッシュが モンスターに
      つぶされてしまいました。

      その上 国民たちも かなり
      混乱しているようです。
      早く 何とかしなければ ･ ･ ･
    "original_byte_length": !!int |-

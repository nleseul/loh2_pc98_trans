  !!int "25986": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>兵士<C_NONE>
      <IF0090><JUMP6602>アトラス王子さま。
      もしも おふたりでは 危険でしたら
      われわれも お手伝いします。

      いつでも 呼びに いらしてください。<END>
      <LOC6602>これはよかった フローラさまは
      無事だったのですね。

      ジェラルドさまが 心配されて 国境の兵士たちに フローラさまが 通ったら連絡するようにと 頼んだそうですが
      これで 安心することでしょう。
    "original_byte_length": !!int |-
      311
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54754
      "target_addr": !!int |-
        25986
    "translated": |-
      <C_YELLOW>Soldier<C_NONE>
      <IF0090><JUMP6602>If the two of you encounter any
      trouble, please come to us for
      help.

      We are your Highness's to command.<END>
      <LOC6602>I'm pleased to see that Flora is
      safe.

      Gerald was so worried that he
      asked the guards at the border to
      contact him if she passed through.He'll surely be relieved.
  !!int "26297": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>兵士<C_NONE>
      ソニアさま たいへんです !!

      <CALL6cf5>どうでしたか 王家の墓は？

      <C_YELLOW>兵士<C_NONE>
      はい やはり ソニアさまの お考え
      どおりでした。

      扉が壊されており 中は モンスターがわがもの顔で 歩き回っております。

      それに ちょっと 気になったのですが入口に こんな物が 落ちていました。

      <CALL6cf5>こっ これは !!<WAIT>
      このワプの翼は ジェラルド殿の
      お嬢さまの物では ありませんか。

      まさか あの中に 入ったのでは ･ ･ ･

      <C_YELLOW>兵士<C_NONE>
      私ひとりでは どうにもなりません。
      何人かを 引き連れて もういちど
      中を調べてまいりましょうか？

      <ASMd661><Xf7><CH0>
      ソニアさま フローラさんに 何か
      あったのですか？

      <ASMd66f><Xf7><CALL6cf5>先ほど 王家の墓のことが心配になり
      兵士に ようすを見に行かせたのです。

      すると 入口に フローラお嬢さまの
      名前で登録された ワプの翼が 落ちていたそうなのです。

      王家の墓では モンスターが たくさんいたそうなので お嬢さまの身に
      もしものことがなければと ･ ･ ･

      <CH0>
      そうですか ･ ･ ･ フローラさんには
      ぼくたちも いろいろと お世話に
      なったのです。

      もしよかったら ぼくたちに まかせてもらえませんか？

      <CALL6cf5>いいえ 王子さまが そんなことを
      なさらなくても わが国の兵士たちは
      優秀ですから だいじょうぶですわ。

      <CH1>
      ほんとかね。
      おれには そうは見えねえけどな。

      <CH0>
      ランドー !! 失礼だぞ !!

      でも ぼくたちも フローラさんの
      ことが心配ですから 行くだけでも
      行かせてください。

      <CALL6cf5>王子さまが そこまで 言うのでしたらお願いしましょう。

      お嬢さまは きれいな方ですからね
      王子さまが それほどまで 心配なさる気持ちも よくわかりますわ。<IF0466><JUMP6cf4>

      <CH1>
      ところで その王家の墓って どこに
      あるか 知ってるのか？

      <CH0>
      あっ ･ ･ ･ ･ ･ ･ ･ ･

      <CALL6cf5>王子さま 夢中になりすぎるのも
      考えものですわね。

      王家の墓は ナッシュの南にある山の
      反対側に 入口があります。

      <CH0>
      ナッシュの山の南側ですね？
      わかりました。

      さあ ランドー いそごう。<LOC6cf4>
    "original_byte_length": !!int |-
      1596
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54798
      "target_addr": !!int |-
        26297
    "translated": "<C_YELLOW>Soldier<C_NONE>\nYour Majesty!! We have trouble!\n\n\
      <CALL6cf5>What is it? The Royal Tomb?\n\n<C_YELLOW>Soldier<C_NONE>\nYes, just\
      \ as your Majesty\nsuspected.\n\nThe door is broken open, and\nmonsters are\
      \ wandering around\nfreely inside.\n\nAlso, I spotted this at the\nentrance.\n\
      \n<CALL6cf5>T-that's...!<WAIT>\nDoesn't that Warp Wing belong\nto Gerald's daughter?\n\
      \nIn there? Why would she...?\n\n<C_YELLOW>Soldier<C_NONE>\nI can't do anything\
      \ more alone.\nShall I take a larger party to\ninvestigate further?\n\n<ASMd661><Xf7><CH0>\n\
      Your Majesty, has something\nhappened to Flora?\n\n<ASMd66f><Xf7><CALL6cf5>I\
      \ was worried about the Royal Tomb,so I sent a soldier to check on ita while\
      \ ago.\n\nAnd he found a Warp Wing\nregistered under Flora's name\nthat had\
      \ been dropped there.\n\nThere are a lot of monsters in\nthe Royal Tomb. If\
      \ anything shouldhappen to the young lady...\n\n<CH0>\nI see... And Flora has\
      \ done a lot\nto help us.\n\nIf you don't mind, could we go andlook for her?\n\
      \n<CALL6cf5>No, I can't allow that, your\nHighness. Our soldiers are more\n\
      than competent to handle this.\n\n<CH1>\nReally?\nThey don't look it to me.\n\
      \n<CH0>\nLandor!! Don't be so blunt.\n\nBut we really are worried about\nFlora.\
      \ Please let us go look, evenif we can't do more than that.\n\n<CALL6cf5>If\
      \ your Highness insists, I \nsuppose I'll leave it to you.\n\nShe is a lovely\
      \ girl, isn't she?\nI can see why you would be so\nconcerned about her.\n<IF0466><JUMP6cf4>\n\
      \n<CH1>\nDo you have any idea where this\nRoyal Tomb place is?\n\n<CH0>\nUmm...\n\
      \n<CALL6cf5>You're not thinking very clearly,\nare you? Try to stay focused,\n\
      your Highness.\n\nThe entrance to the Royal Tomb is\non the far side of the\
      \ mountains\nsouth of Nashieu.\n\n<CH0>\nThe south side of the mountains\nnear\
      \ Nashieu? Okay, I've got it.\n\nLet's go, Landor!<LOC6cf4>"

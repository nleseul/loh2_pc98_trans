      "target_addr": !!int |-
        24572
    "translated": |-
      <C_YELLOW>Child<C_NONE>
      My mom's in Larfa. But I made
      friends, so I'm not lonely.
  !!int "24674": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>子供<C_NONE>
      ぼくたち いつも ２人でかくれんぼをしてたんだけど ３人でやったら
      もっと おもしろかったよ。
    "original_byte_length": !!int |-

      "target_addr": !!int |-
        24332
    "translated": |-
      <C_YELLOW>Erich<C_NONE>
      I used to live in this town. It
      feels strange to be back.
  !!int "24415": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>子供<C_NONE>
      ママがね 町から外に出るなって
      言うんだよ。こわいモンスターが
      いるから だめなんだって。

      でも 遊び友だちが できたから
      町の中にいても おもしろいけどね。
    "original_byte_length": !!int |-
      157
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54696
      "target_addr": !!int |-
        24415
    "translated": |-
      <C_YELLOW>Child<C_NONE>
      Mom said not to leave town becauseof the scary monsters.

      But there's other kids to play
      with in town now, so it's fun
      here too.
  !!int "24572": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>子供<C_NONE>
      ぼくのお母さんは ラルファに
      いるんだって でも さみしくないんだここで 友だちが できたんだもん。
    "original_byte_length": !!int |-
      102
    "references":

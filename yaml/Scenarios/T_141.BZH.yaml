  !!int "23324": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>兵士<C_NONE>
      これは 王子さま。ジェストンさまは
      城の２階に いらっしゃいます。
      どうぞ お入りください。
    "original_byte_length": !!int |-
      95
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54633
      "target_addr": !!int |-
        23324
    "translated": |-
      <C_YELLOW>Soldier<C_NONE>
      Duke Jestonn is on the second
      floor. Please enter, Your Highness.
  !!int "23419": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>男<C_NONE>
      世の中が 暗黒に包まれた時
      竜の卵から 真紅の竜がかえり
      邪悪なものを焼きつくす。

      こんな言い伝え 知ってますか？
      父が よく言っていたんですけど
      全然 話が違いましたね。
      まさか モンスターが 出てくるとは。
    "original_byte_length": !!int |-
      203
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54642
      "target_addr": !!int |-
        23419
    "translated": |-
      <C_YELLOW>Man<C_NONE>
      When all is veiled in darkness,
      the Crimson Dragon will hatch fromthe dragonseggs and burn away evil.

      Have you ever heard that legend?
      It's what my father always said,
      but this different! Those
      monsters... I can't believe it!
  !!int "23622": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>男<C_NONE>
      きいてくれよ 見ちゃったんだ
      ジェストンさまの 後継ぎ候補 !!

      ここだけの 話だけどな あれじゃ
      だれが なっても 先が不安だよ。
      その上 外には モンスターがいるし
      ウォンリークは どうなるんだろう？
    "original_byte_length": !!int |-
      193
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54651
      "target_addr": !!int |-
        23622
    "translated": |-
      <C_YELLOW>Man<C_NONE>
      Listen! I saw' em!
      The candidates for Duke Jestonn's
      successor!!

      Don't tell anyone I said this, butnone of 'em make me feel good. Andwith monsters outside, what's
      gonna happen to Wonliech?
  !!int "23815": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>女<C_NONE>
      うちの子に 遊び友だちが できたの。マスクーンから 逃げてきたという
      ２人の男の子なのよ。

      でも 母親は ラルファに
      逃げたらしくて 今は 別々なのよ。
      早く いっしょに なれればいいけど。
    "original_byte_length": !!int |-
      183
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54660
      "target_addr": !!int |-
        23815
    "translated": |-
      <C_YELLOW>Woman<C_NONE>
      My kid's got some new playmates.
      Two boys who fled from Maschun.

      I hear their mother escaped to
      Larfa and they got separated from
      her, though. I hope they get
      reunited soon.
  !!int "23998": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>老人<C_NONE>
      この前の地震は 竜の卵が かえる
      しるしに ちがいないと 思って
      いたのじゃ。

      でも まさか モンスターが 生まれて
      くるとは 思わなかったわい。
    "original_byte_length": !!int |-
      142
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54669
      "target_addr": !!int |-
        23998
    "translated": |-
      <C_YELLOW>Old man<C_NONE>
      I knew that earthquake was a sign
      that the dragonseggs were going
      to hatch!

      I sure didn't expect 'em to hatch
      into monsters, though.
  !!int "24140": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>フォルス<C_NONE>
      フォッフォッフォ
      子供は 元気なのが一番じゃ。

      わしの家で 遊んでいた 子どもたちを連れて ここまで逃げてきたのじゃ。
      母親は ラルファに いるそうじゃからそのうち ここに来ることじゃろう。
    "original_byte_length": !!int |-
      192
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54678
      "target_addr": !!int |-
        24140
    "translated": |-
      <C_YELLOW>Foless<C_NONE>
      Ha ha ha...
      It's great to see kids so full
      of energy!

      I brought these two with me when Iescaped from Maschun. I think
      their mother's in Larfa, but I'm
      sure she'll get here soon.
  !!int "24332": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>エリック<C_NONE>
      わしは 昔 この町に住んでいたことがあったのじゃよ。
      なつかしいのう ･ ･ ･
    "original_byte_length": !!int |-
      83
    "references":

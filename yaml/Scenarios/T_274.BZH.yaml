      wit' Gina.

      Gave me a good belly laugh, ya
      know. Strong woman like 'er, but
      she can't stand those slimes.<END>
      <LOC6071>I've got a lot o' stuff ta think
      about.

      See, I'm jus' runnin' 3 travel
      routes, right? An' there's places
      where folks are complainin' as
      it's not convenient.

      But less routes means I make more
      money, right? An' that's why I
      'aven't added any for a while.

      But I'm wonderin' if I should add
      some nex' year, seein' as 'ow tha
      new ship'll be ready soon.<END>

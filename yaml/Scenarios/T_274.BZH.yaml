  !!int "23372": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>船員<C_NONE>
      <IF0068><JUMP5bf7>社長の奥さんの ジーナさんは
      モレストンの出身なんだよ。

      スライムって言えば ファーレーンか
      ウォンリークにしか いないだろ。
      だから初めてスライムを見たらしいぜ。<END>
      <LOC5bf7>この多島海のあたりには 竜の卵が
      たくさん あるんだけど モンスターは海を 渡れないのかな？
    "original_byte_length": !!int |-
      259
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54651
      "target_addr": !!int |-
        23372
    "translated": |-
      <C_YELLOW>Sailor<C_NONE>
      <IF0068><JUMP5bf7>Tha pres'dent's wife, Gina, comes
      from Moreston.

      Those slimes... they're just in
      Farleyn an' Wonliech, right?
      So she's prob'ly never seen one
      before.<END>
      <LOC5bf7>There's lots o' dragonseggs
      in tha Archipelago. Maybe monsterscan't cross water, though?
  !!int "23631": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>船員<C_NONE>
      <IF0068><JUMP5cb3>よお あんただろ スライム出したの
      あんな呪文 どこで覚えたんだ？
      おれにも 教えてくれよ。<END>
      <LOC5cb3>いったい 何が起こったんだろうな？
      ふしぎなことだぜ まったく。

      んっ おどろいちゃいるけどよ
      ここは 安全だから 関係ねえんだよ。
    "original_byte_length": !!int |-
      225
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54660
      "target_addr": !!int |-
        23631
    "translated": |-
      <C_YELLOW>Sailor<C_NONE>
      <IF0068><JUMP5cb3>You're tha ones as made those
      slimes, right? Where'd ya learn
      that spell? Can ya teach me it?<END>
      <LOC5cb3>What tha hell's goin' on?
      All this funny business...

      Well, it's surprisin', but we're
      safe here. So it's got nothin' ta
      do wit' us.
  !!int "23856": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>船員<C_NONE>
      あーあ ヒマだなー
      昔は 良かったよなー

      酒飲んだり バクチしたり 定期船を
      おそった ･ ･ ･ あぶねえ あぶねえ。
    "original_byte_length": !!int |-
      113
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54669
      "target_addr": !!int |-
        23856
    "translated": |-
      <C_YELLOW>Soldier<C_NONE>
      Nothin' ta do...
      I miss the old days...

      Drinkin', gamblin', attackin'
      ships...
      Whoa! Ya didn't hear that, right?
  !!int "23969": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>船員<C_NONE>
      ジーナさんって こわいんだよな。
      あの人見てると 社長の お袋さんを
      思い出すよな。
    "original_byte_length": !!int |-
      87
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54678
      "target_addr": !!int |-
        23969
    "translated": |-
      <C_YELLOW>Sailor<C_NONE>
      I'm sort o' scared o' Gina.
      Whene'er I look at 'er, I remembertha pres'dent's ma.
  !!int "24056": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>船員<C_NONE>
      な、何だよ おれたちゃ バクチ
      やってるわけじゃねえぞ ちゃんと
      仕事してるんだからな。

      ほら見ろ 新しい船を 考えてるんだ。今より 速くて 人をたくさん
      乗せられるやつだ。
    "original_byte_length": !!int |-
      171
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54687
      "target_addr": !!int |-
        24056
    "translated": |-
      <C_YELLOW>Sailor<C_NONE>
      What? Gamblin'? Nah, we'd ne'er doanything like that 'ere.

      See here? I'm thinkin' 'bout a newship. Faster 'n what we have, so'swe can carry lots o passengers.
  !!int "24227": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>船員<C_NONE>
      おっと 気をつけてくれよ。
      ここには バクヤクが たくさん
      あるんだからよ。

      えっ 何に 使うかって？
      そんなの きくまでもねえだろ。
    "original_byte_length": !!int |-
      132
    "references":
    - !CodeReference
      "source_addr": !!int |-
        54696
      "target_addr": !!int |-
        24227
    "translated": |-
      <C_YELLOW>Sailor<C_NONE>
      Oi, watch yerselves!
      This place's full o' black powder.

      Huh? What do we use it fer?
      What do ya think?
  !!int "24359": !RelocatableTranslatableEntry
    "original": |-
      <C_YELLOW>船員<C_NONE>
      ここには 変わった宝石が たくさん
      あるんだぜ。社長の趣味なんだ。
    "original_byte_length": !!int |-
      71
    "references":

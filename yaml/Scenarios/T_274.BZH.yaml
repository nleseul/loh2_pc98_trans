      "target_addr": !!int |-
        24359
    "translated": |-
      <C_YELLOW>Sailor<C_NONE>
      There's a bunch o' rare jewels
      in here. It's tha pres'dent's
      hobby.
  !!int "24430": !RelocatableTranslatableEntry
    "original": "<C_YELLOW>ジゴ<C_NONE>\nあー いてー ･ ･ ･ \n社長とジーナさんと 両方から\nボコボコに されちまったよ。"
